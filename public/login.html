<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - GitUpload</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    .auth-page::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 400px;
      position: relative;
    }
    .auth-card h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .auth-card .subtitle {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .auth-card .btn { width: 100%; }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text2);
    }
    .auth-footer a { font-weight: 600; }
    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .brand-logo svg { width: 28px; height: 28px; }
    .brand-logo span { font-weight: 800; font-size: 18px; }
    .login-hint {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(59,130,246,0.05);
      border: 1px solid rgba(59,130,246,0.1);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text2);
      text-align: center;
    }
    .login-hint a { font-weight: 500; }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text2);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .divider span { padding: 0 12px; }
    .github-login-box {
      display: none;
      margin-top: 8px;
    }
    .github-login-box .field { margin-bottom: 12px; }
    .github-login-box .btn-github {
      background: #24292f;
      color: #fff;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .github-login-box .btn-github:hover { background: #1c2025; }
    .github-login-box .btn-github:disabled { opacity: 0.6; cursor: not-allowed; }
    .github-link {
      text-align: center;
      margin-top: 12px;
    }
    .github-link a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #24292f;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .github-link a:hover {
      border-color: #24292f;
      background: rgba(36,41,47,0.04);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">
      <a href="/" style="color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
        GitUpload
      </a>
    </div>
    <div class="nav-links">
      <a href="/register">注册</a>
    </div>
  </nav>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
        <span>GitUpload</span>
      </div>
      <h2>欢迎回来</h2>
      <p class="subtitle">登录你的账号继续使用</p>
      <div id="alert"></div>
      <div class="field">
        <label>用户名</label>
        <input type="text" id="username" placeholder="输入用户名" onkeypress="if(event.key==='Enter')document.getElementById('password').focus()">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" placeholder="输入密码" onkeypress="if(event.key==='Enter')login()">
      </div>
      <button class="btn btn-primary" id="btn" onclick="login()">登录</button>

      <div class="divider"><span>或</span></div>

      <!-- GitHub Token 登录 -->
      <div class="github-link">
        <a href="javascript:void(0)" onclick="toggleGithubLogin()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub 登录
        </a>
      </div>
      <div class="github-login-box" id="githubLoginBox">
        <div class="field">
          <label>GitHub Personal Access Token</label>
          <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" onkeypress="if(event.key==='Enter')githubLogin()">
        </div>
        <button class="btn-github" id="ghBtn" onclick="githubLogin()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          用 GitHub Token 登录
        </button>
        <p style="font-size:12px;color:var(--text2);margin-top:8px;text-align:center;">
          没有 Token？<a href="https://github.com/settings/tokens/new?scopes=repo,read:user&description=GitUpload" target="_blank" style="color:var(--blue);">点这里创建</a>
        </p>
      </div>

      <p class="auth-footer">
        没有账号？<a href="/register">立即注册</a>
      </p>
      <div class="login-hint">
        首次部署后请修改管理员默认密码以确保安全
      </div>
    </div>
  </div>
  <script>
    // ===== 动态版本检测：从 API 获取版本号，部署后强制刷新 =====
    async function checkAppVersion() {
      try {
        var res = await fetch('/api/auth/version');
        var data = await res.json();
        if (data.ok && data.version) {
          var stored = localStorage.getItem('app_version');
          if (stored && stored !== data.version) {
            localStorage.setItem('app_version', data.version);
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage('CLEAR_CACHE');
            }
            window.location.reload(true);
          } else if (!stored) {
            localStorage.setItem('app_version', data.version);
          }
        }
      } catch(e) {}
    }
    checkAppVersion();
    setInterval(checkAppVersion, 5 * 60 * 1000);

    // ===== Service Worker 注册 =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    }

    async function login() {
      var btn = document.getElementById('btn');
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var alertEl = document.getElementById('alert');
      if (!username || !password) { alertEl.innerHTML = '<div class="alert alert-err">请填写用户名和密码</div>'; return; }
      btn.disabled = true; btn.textContent = '登录中...';
      try {
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        var data = await res.json();
        if (data.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          // 记录是否需要强制修改密码，由目标页面检测并弹出
          if (data.needChangePassword === true) {
            localStorage.setItem('needChangePassword', 'true');
          }
          window.location.href = data.redirect || '/dashboard';
        } else {
          alertEl.innerHTML = '<div class="alert alert-err">' + escapeHtml(data.error) + '</div>';
        }
      } catch (e) {
        alertEl.innerHTML = '<div class="alert alert-err">网络错误，请重试</div>';
      }
      btn.disabled = false; btn.textContent = '登录';
    }
    function escapeHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function toggleGithubLogin() {
      var box = document.getElementById('githubLoginBox');
      if (box.style.display === 'block') {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
        document.getElementById('ghToken').focus();
      }
    }

    async function githubLogin() {
      var btn = document.getElementById('ghBtn');
      var token = document.getElementById('ghToken').value.trim();
      var alertEl = document.getElementById('alert');
      if (!token) { alertEl.innerHTML = '<div class="alert alert-err">请输入 GitHub Token</div>'; return; }
      btn.disabled = true; btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="animation:spin 0.8s linear infinite;"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg> 验证中...';
      try {
        var res = await fetch('/api/auth/github-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token })
        });
        var data = await res.json();
        if (data.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          if (data.githubUser) {
            alertEl.innerHTML = '<div class="alert alert-ok">GitHub 用户 ' + escapeHtml(data.githubUser) + ' 登录成功，正在跳转...</div>';
          }
          window.location.href = data.redirect || '/dashboard';
        } else {
          alertEl.innerHTML = '<div class="alert alert-err">' + escapeHtml(data.error) + '</div>';
        }
      } catch (e) {
        alertEl.innerHTML = '<div class="alert alert-err">网络错误，请重试</div>';
      }
      btn.disabled = false;
      btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg> 用 GitHub Token 登录';
    }
  </script>
</body>
</html>
