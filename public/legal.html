<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法律文档 - GitShip</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css?v=3.0.0">
  <style>
    .legal-page { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .legal-tabs {
      display: flex; gap: 4px; margin-bottom: 24px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 4px;
    }
    .legal-tab {
      flex: 1; text-align: center; padding: 10px 16px;
      font-size: 14px; font-weight: 600; color: var(--text2);
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .legal-tab.active { background: var(--blue); color: #fff; }
    .legal-content {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px;
    }
    .legal-content h1 { font-size: 24px; margin-bottom: 8px; }
    .legal-content .legal-date { color: var(--text2); font-size: 13px; margin-bottom: 32px; }
    .legal-content .legal-body { white-space: pre-wrap; font-size: 14px; line-height: 1.8; color: var(--text); }
    .legal-content .legal-body h2 { font-size: 18px; margin-top: 24px; margin-bottom: 12px; }
    .legal-empty { text-align: center; padding: 60px 20px; color: var(--text2); }
    .complaint-box {
      margin-top: 32px; padding: 20px; background: rgba(59,130,246,0.05);
      border: 1px solid rgba(59,130,246,0.15); border-radius: 10px;
    }
    .complaint-box h4 { font-size: 15px; margin-bottom: 8px; }
    .complaint-box p { font-size: 13px; color: var(--text2); line-height: 1.6; }
    .complaint-box a { color: var(--blue); font-weight: 500; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">
      <a href="/" style="color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
        GitShip
      </a>
    </div>
    <div class="nav-links">
      <a href="/login">登录</a>
      <a href="/register">注册</a>
    </div>
  </nav>
  <div class="legal-page">
    <div class="legal-tabs">
      <div class="legal-tab active" onclick="switchTab('agreement')">用户协议</div>
      <div class="legal-tab" onclick="switchTab('privacy')">隐私政策</div>
    </div>
    <div class="legal-content" id="legalContent">
      <div class="legal-empty">正在加载...</div>
    </div>
    <div class="complaint-box" id="complaintBox" style="display:none;">
      <h4>侵权投诉</h4>
      <p>如果你认为本平台上的某项内容侵犯了你的合法权益，请通过邮箱投诉：<a id="complaintEmailLink" href="#">联系投诉</a></p>
    </div>
  </div>
  <script>
    var legalData = null;

    async function loadLegalDocs() {
      try {
        var res = await fetch('/api/auth/public-settings');
        var data = await res.json();
        if (data.ok) {
          legalData = data.settings;
          // ===== 动态应用站点名称 =====
          if (legalData.siteName) {
            var name = legalData.siteName;
            document.title = '法律文档 - ' + name;
            document.querySelectorAll('.nav-brand a').forEach(function(el) {
              if (el.tagName === 'A') {
                var svg = el.querySelector('svg');
                el.textContent = '';
                if (svg) el.appendChild(svg);
                el.appendChild(document.createTextNode(' ' + name));
              }
            });
          }
          if (!legalData.legalEnabled) {
            document.getElementById('legalContent').innerHTML = '<div class="legal-empty">法律文档暂未开放</div>';
            return;
          }
          switchTab('agreement');
          if (legalData.complaintEmail) {
            document.getElementById('complaintBox').style.display = 'block';
            var link = document.getElementById('complaintEmailLink');
            link.href = 'mailto:' + legalData.complaintEmail;
            link.textContent = legalData.complaintEmail;
          }
        }
      } catch (e) {
        document.getElementById('legalContent').innerHTML = '<div class="legal-empty">加载失败，请刷新重试</div>';
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.legal-tab').forEach(function(el) { el.classList.remove('active'); });
      var idx = tab === 'agreement' ? 0 : 1;
      document.querySelectorAll('.legal-tab')[idx].classList.add('active');

      if (!legalData) return;
      var content = tab === 'agreement' ? legalData.userAgreement : legalData.privacyPolicy;
      var title = tab === 'agreement' ? (legalData.siteName || 'GitShip') + ' 用户协议' : (legalData.siteName || 'GitShip') + ' 隐私政策';
      if (!content) {
        document.getElementById('legalContent').innerHTML = '<div class="legal-empty">暂无内容</div>';
        return;
      }
      // 提取第一行作为日期，其余作为正文
      var lines = content.split('\n');
      var body = content;
      var date = '';
      var dateMatch = content.match(/最后更新日期：(.+)/);
      if (dateMatch) date = dateMatch[1];
      document.getElementById('legalContent').innerHTML =
        '<h1>' + escapeHtml(title) + '</h1>' +
        (date ? '<div class="legal-date">最后更新：' + escapeHtml(date) + '</div>' : '') +
        '<div class="legal-body">' + escapeHtml(content) + '</div>';
    }

    function escapeHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Service Worker 注册
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    }

    // 动态版本检测
    async function checkAppVersion() {
      try {
        var res = await fetch('/api/auth/version');
        var data = await res.json();
        if (data.ok && data.version) {
          var stored = localStorage.getItem('app_version');
          if (stored && stored !== data.version) {
            localStorage.setItem('app_version', data.version);
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage('CLEAR_CACHE');
            }
            window.location.reload(true);
          } else if (!stored) {
            localStorage.setItem('app_version', data.version);
          }
        }
      } catch(e) {}
    }
    checkAppVersion();

    loadLegalDocs();
  </script>
</body>
</html>
