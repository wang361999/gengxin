<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - GitShip</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css?v=2.8.1">
  <style>
    .auth-page {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    .auth-page::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(16,185,129,0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 400px;
      position: relative;
    }
    .auth-card h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .auth-card .subtitle {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .auth-card .btn { width: 100%; }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text2);
    }
    .auth-footer a { font-weight: 600; }
    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .brand-logo svg { width: 28px; height: 28px; }
    .brand-logo span { font-weight: 800; font-size: 18px; }
    .benefits {
      margin-top: 20px;
      padding: 16px;
      background: rgba(59,130,246,0.04);
      border-radius: 8px;
    }
    .benefits p {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 6px;
    }
    .benefits p:last-child { margin-bottom: 0; }
    .benefits .check { color: var(--green); margin-right: 6px; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">
      <a href="/" style="color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
        GitShip
      </a>
    </div>
    <div class="nav-links">
      <a href="/login">登录</a>
    </div>
  </nav>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
        <span>GitShip</span>
      </div>
      <h2>创建账号</h2>
      <p class="subtitle">免费注册，即刻开始上传</p>
      <div id="alert"></div>
      <div id="registerForm">
        <div class="field">
          <label>用户名</label>
          <input type="text" id="username" placeholder="3-20 个字符">
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" id="password" placeholder="至少 6 位">
        </div>
        <div class="field">
          <label>品牌名称（可选）</label>
          <input type="text" id="brandName" placeholder="你的品牌名，默认用用户名">
        </div>
        <button class="btn btn-primary" id="btn" onclick="register()">注册</button>
        <div class="benefits">
          <p><span class="check">&#10003;</span> 免费，无隐藏费用</p>
          <p><span class="check">&#10003;</span> 支持多仓库管理</p>
          <p><span class="check">&#10003;</span> Token 加密存储，安全可靠</p>
        </div>
        <p class="auth-footer">
          已有账号？<a href="/login">去登录</a>
        </p>
      </div>
      <div id="closedNotice" style="display:none;text-align:center;padding:20px 0;">
        <div style="font-size:48px;margin-bottom:16px;">🔒</div>
        <h3 style="margin-bottom:8px;">注册已关闭</h3>
        <p style="color:var(--text2);font-size:14px;margin-bottom:20px;">系统当前已关闭注册功能，请联系管理员获取账号。</p>
        <a href="/login" class="btn btn-outline">返回登录</a>
      </div>
    </div>
  </div>
  <script>
    // 检查是否允许注册
    (async function() {
      try {
        var res = await fetch('/api/auth/public-settings');
        var data = await res.json();
        if (data.ok && !data.settings.allowRegister) {
          document.getElementById('registerForm').style.display = 'none';
          document.getElementById('closedNotice').style.display = 'block';
        }
      } catch (e) {}
    })();

    async function register() {
      var btn = document.getElementById('btn');
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var brandName = document.getElementById('brandName').value.trim();
      var alertEl = document.getElementById('alert');
      if (!username || !password) { alertEl.innerHTML = '<div class="alert alert-err">请填写用户名和密码</div>'; return; }
      btn.disabled = true; btn.textContent = '注册中...';
      try {
        var res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, brandName: brandName })
        });
        var data = await res.json();
        if (data.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', 'user');
          window.location.href = '/dashboard';
        } else {
          alertEl.innerHTML = '<div class="alert alert-err">' + escapeHtml(data.error) + '</div>';
        }
      } catch (e) {
        alertEl.innerHTML = '<div class="alert alert-err">网络错误，请重试</div>';
      }
      btn.disabled = false; btn.textContent = '注册';
    }
    function escapeHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    // ===== 动态版本检测：从 API 获取版本号，部署后强制刷新 =====
    async function checkAppVersion() {
      try {
        var res = await fetch('/api/auth/version');
        var data = await res.json();
        if (data.ok && data.version) {
          var stored = localStorage.getItem('app_version');
          if (stored && stored !== data.version) {
            localStorage.setItem('app_version', data.version);
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage('CLEAR_CACHE');
            }
            window.location.reload(true);
          } else if (!stored) {
            localStorage.setItem('app_version', data.version);
          }
        }
      } catch(e) {}
    }
    checkAppVersion();
    setInterval(checkAppVersion, 5 * 60 * 1000);

    // ===== Service Worker 注册 =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    }
  </script>
</body>
</html>
