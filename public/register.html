<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - gitd</title>
  <link rel="manifest" href="/manifest.json">
  <!-- 性能优化：预连接 -->
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.github.com">
  <link rel="stylesheet" href="/style.css?v=3.0.0">
  <style>
    .auth-page {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    .auth-page::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(16,185,129,0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 400px;
      position: relative;
    }
    .auth-card h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .auth-card .subtitle {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .auth-card .btn { width: 100%; }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text2);
    }
    .auth-footer a { font-weight: 600; }
    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .brand-logo svg { width: 28px; height: 28px; }
    .brand-logo span { font-weight: 800; font-size: 18px; }
    .benefits {
      margin-top: 20px;
      padding: 16px;
      background: rgba(59,130,246,0.04);
      border-radius: 8px;
    }
    .benefits p {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 6px;
    }
    .benefits p:last-child { margin-bottom: 0; }
    .benefits .check { color: var(--green); margin-right: 6px; }
    .legal-consent {
      margin-top: 16px;
      padding: 12px 14px;
      background: rgba(249,115,22,0.05);
      border: 1px solid rgba(249,115,22,0.15);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.6;
    }
    .legal-consent label {
      display: flex !important;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
      width: 100%;
    }
    .legal-consent label > input[type="checkbox"] {
      margin-top: 3px;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
    }
    .legal-consent label > span {
      flex: 1 1 auto;
      min-width: 0;
      word-break: break-word;
      display: block;
    }
    .legal-consent a { color: var(--blue); text-decoration: none; }
    .legal-consent a:hover { text-decoration: underline; }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text2);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .divider span { padding: 0 12px; }
    .github-link {
      text-align: center;
      margin-top: 12px;
    }
    .github-link a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #24292f;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .github-link a:hover {
      border-color: #24292f;
      background: rgba(36,41,47,0.04);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">
      <a href="/" style="color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5 16 5l3 3L7.5 19.5 4.5 18.5z"/><path d="m13 8 3 3"/><path d="M16.5 5.5 19 8"/></svg>
        gitd
      </a>
    </div>
    <div class="nav-links">
      <a href="/login">登录</a>
    </div>
  </nav>
  <!-- 未授权提示 -->
  <div id="licenseBanner" style="display:none;">
    <div style="background:linear-gradient(135deg,#1a1a2e,#0f3460);border-bottom:1px solid rgba(59,130,246,0.2);padding:12px 20px;text-align:center;">
      <span style="font-size:13px;color:#a1a1b5;">本站未获得正式授权，请前往 <a href="https://gitd.cn" target="_blank" rel="noopener" style="color:#60a5fa;font-weight:600;">gitd.cn</a> 获取正版授权</span>
    </div>
  </div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5 16 5l3 3L7.5 19.5 4.5 18.5z"/><path d="m13 8 3 3"/><path d="M16.5 5.5 19 8"/></svg>
        <span>gitd</span>
      </div>
      <h2>创建账号</h2>
      <p class="subtitle">免费注册，即刻开始上传</p>
      <div id="alert"></div>
      <div id="registerForm">
        <div class="field">
          <label>用户名</label>
          <input type="text" id="username" placeholder="3-20 个字符">
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" id="password" placeholder="至少 6 位">
        </div>
        <div class="field">
          <label>品牌名称（可选）</label>
          <input type="text" id="brandName" placeholder="你的品牌名，默认用用户名">
        </div>
        <button class="btn btn-primary" id="btn" onclick="register()">注册</button>
        <div class="legal-consent">
          <label>
            <input type="checkbox" id="agreeLegal">
            <span>我已阅读并同意 <a href="/legal" target="_blank">《用户协议》</a> 和 <a href="/legal" target="_blank">《隐私政策》</a>，承诺不上传侵权、涉密或违反开源协议的内容。</span>
          </label>
        </div>

        <div class="divider"><span>或</span></div>

        <!-- GitHub OAuth 注册 -->
        <div class="github-link">
          <a href="javascript:void(0)" onclick="githubOAuthLogin()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            使用 GitHub 账号注册
          </a>
        </div>
        <div class="benefits">
          <p><span class="check">&#10003;</span> 免费，无隐藏费用</p>
          <p><span class="check">&#10003;</span> 支持多仓库管理</p>
          <p><span class="check">&#10003;</span> Token 加密存储，安全可靠</p>
        </div>
        <p class="auth-footer">
          已有账号？<a href="/login">去登录</a>
        </p>
      </div>
      <div id="closedNotice" style="display:none;text-align:center;padding:20px 0;">
        <div style="font-size:48px;margin-bottom:16px;">🔒</div>
        <h3 style="margin-bottom:8px;">注册已关闭</h3>
        <p style="color:var(--text2);font-size:14px;margin-bottom:20px;">系统当前已关闭注册功能，请联系管理员获取账号。</p>
        <a href="/login" class="btn btn-outline">返回登录</a>
      </div>
    </div>
  </div>
  <script>
    // ===== 检查是否允许注册 =====
    (async function() {
      try {
        var res = await fetch('/api/auth/public-settings');
        var data = await res.json();
        if (data.ok && !data.settings.allowRegister) {
          document.getElementById('registerForm').style.display = 'none';
          document.getElementById('closedNotice').style.display = 'block';
        }
      } catch (e) {}
    })();

    // ===== 授权状态检查：未授权时显示提示横幅 =====
    (function checkLicenseBanner() {
      fetch('/api/auth/public-settings').then(function(res) {
        return res.json();
      }).then(function(data) {
        if (data && data.ok && data.license) {
          var banner = document.getElementById('licenseBanner');
          if (banner) {
            if (!data.license.authorized) {
              banner.style.display = 'block';
            } else {
              banner.style.display = 'none';
            }
          }
        }
      }).catch(function() {});
    })();

    async function register() {
      var btn = document.getElementById('btn');
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var brandName = document.getElementById('brandName').value.trim();
      var alertEl = document.getElementById('alert');
      if (!username || !password) { alertEl.innerHTML = '<div class="alert alert-err">请填写用户名和密码</div>'; return; }
      if (!document.getElementById('agreeLegal').checked) {
        alertEl.innerHTML = '<div class="alert alert-err">请阅读并同意《用户协议》和《隐私政策》</div>';
        return;
      }
      btn.disabled = true; btn.textContent = '注册中...';
      try {
        var res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, brandName: brandName })
        });
        var data = await res.json();
        if (data.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', 'user');
          window.location.href = '/dashboard';
        } else {
          alertEl.innerHTML = '<div class="alert alert-err">' + escapeHtml(data.error) + '</div>';
        }
      } catch (e) {
        alertEl.innerHTML = '<div class="alert alert-err">网络错误，请重试</div>';
      }
      btn.disabled = false; btn.textContent = '注册';
    }
    function escapeHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ===== GitHub OAuth 注册（跳转授权） =====
    async function githubOAuthLogin() {
      try {
        var res = await fetch('/api/oauth/github-auth-url');
        var data = await res.json();
        if (data.ok && data.authUrl) {
          window.location.href = data.authUrl;
        } else {
          var alertEl = document.getElementById('alert');
          if (alertEl) {
            alertEl.innerHTML = '<div class="alert alert-err">GitHub 登录未配置，请联系管理员</div>';
          }
        }
      } catch (e) {
        var alertEl = document.getElementById('alert');
        if (alertEl) {
          alertEl.innerHTML = '<div class="alert alert-err">网络错误，请稍后重试</div>';
        }
      }
    }
    // ===== 动态版本检测：从 API 获取版本号，部署后强制刷新 =====
    async function checkAppVersion() {
      try {
        var res = await fetch('/api/auth/version');
        var data = await res.json();
        if (data.ok && data.version) {
          var stored = localStorage.getItem('app_version');
          if (stored && stored !== data.version) {
            localStorage.setItem('app_version', data.version);
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage('CLEAR_CACHE');
            }
            window.location.reload(true);
          } else if (!stored) {
            localStorage.setItem('app_version', data.version);
          }
        }
      } catch(e) {}
    }
    checkAppVersion();
    setInterval(checkAppVersion, 5 * 60 * 1000);

    // ===== Service Worker 注册 =====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    }

    // ===== 动态应用站点名称 =====
    (async function applySiteName() {
      try {
        var res = await fetch('/api/auth/public-settings');
        var data = await res.json();
        if (!data.ok || !data.settings.siteName) return;
        var name = data.settings.siteName;
        document.title = '注册 - ' + name;
        document.querySelectorAll('.nav-brand a, .brand-logo span').forEach(function(el) {
          if (el.tagName === 'SPAN' && el.textContent === 'gitd') el.textContent = name;
          else if (el.tagName === 'A') {
            var svg = el.querySelector('svg');
            el.textContent = '';
            if (svg) el.appendChild(svg);
            el.appendChild(document.createTextNode(' ' + name));
          }
        });
      } catch (e) {}
    })();
  </script>
</body>
</html>
